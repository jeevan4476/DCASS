# docker-compose.yml for DCASS Simulation Sandbox & Production Web Stack
#
# Quick start:
#   docker compose --profile web up -d --build                 # web UI + backend API
#   docker compose --profile web --profile proxy up -d --build # web UI + API + Caddy HTTPS
#   docker compose up                                          # sender + receiver CLI sandbox
#   docker compose --profile training run dcass-gen-traffic    # generate behavioral traffic
#   docker compose --profile training run dcass-train-gan      # train GAN
#   docker compose --profile training run dcass-train-rl       # train RL
#   docker compose --profile monitoring up tensorboard         # TensorBoard
#   docker compose --profile web --profile proxy down          # stop web stack

# ============================================================================
# Shared configuration (reusable YAML anchors)
# ============================================================================
x-common-env: &common-env
  PYTHONUNBUFFERED: "1"
  CUDA_VISIBLE_DEVICES: ""
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTORCH_CUDA_ALLOC_CONF: "garbage_collection_threshold:0.6"

x-resource-limits: &resource-limits
  deploy:
    resources:
      limits:
        memory: 2G
        cpus: '2.0'
      reservations:
        memory: 512M
        cpus: '0.5'

# ============================================================================
# Services
# ============================================================================
services:
  # ─────────────────────────────────────────────────────────────────────────
  # Alice: The Sender (CLI simulation sandbox)
  # ─────────────────────────────────────────────────────────────────────────
  dcass-sender:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      cache_from:
        - dcass:latest
    image: dcass:sender
    container_name: dcass-alice
    hostname: alice
    environment:
      <<: *common-env
      DCASS_ROLE: sender
      DCASS_SHARED_DIR: /app/shared_channel
      DCASS_MODE: ${DCASS_MODE:-static}
      DCASS_PROFILE: ${DCASS_PROFILE:-casual}
      DCASS_SEQ_LENGTH: ${DCASS_SEQ_LENGTH:-20}
      DCASS_BASE_DELAY: ${DCASS_BASE_DELAY:-3.0}
      DCASS_MESSAGE: ${DCASS_MESSAGE:-Meet at the cafe at noon}
    volumes:
      - ./storage/shared_channel:/app/shared_channel:rw
      - ./storage/data:/app/storage/data:ro
      - ./storage/models:/app/storage/models:ro
      - ./storage/logs/sender:/app/logs:rw
    networks:
      - dcass-network
    <<: *resource-limits
    command: >
      python -u scripts/runtime/run_sender.py
        --mode ${DCASS_MODE:-static}
        --profile ${DCASS_PROFILE:-casual}
        --sequence-length ${DCASS_SEQ_LENGTH:-20}
        --base-delay ${DCASS_BASE_DELAY:-3.0}
        --message "${DCASS_MESSAGE:-Meet at the cafe at noon}"
        --shared-dir /app/shared_channel
    depends_on:
      dcass-receiver:
        condition: service_healthy
    restart: "no"

  # ─────────────────────────────────────────────────────────────────────────
  # Bob: The Receiver (CLI simulation sandbox)
  # ─────────────────────────────────────────────────────────────────────────
  dcass-receiver:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      cache_from:
        - dcass:latest
    image: dcass:receiver
    container_name: dcass-bob
    hostname: bob
    environment:
      <<: *common-env
      DCASS_ROLE: receiver
      DCASS_SHARED_DIR: /app/shared_channel
    volumes:
      - ./storage/shared_channel:/app/shared_channel:rw
      - ./storage/data:/app/storage/data:ro
      - ./storage/logs/receiver:/app/logs:rw
    networks:
      - dcass-network
    <<: *resource-limits
    command: >
      python -u scripts/runtime/run_receiver.py
        --watch /app/shared_channel
        --timeout ${RECEIVER_TIMEOUT:-10}
        --exit-after-decode
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/shared_channel') else 1)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: "no"

  # ─────────────────────────────────────────────────────────────────────────
  # Training Services (profile: training)
  # ─────────────────────────────────────────────────────────────────────────
  dcass-gen-traffic:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: dcass:training
    container_name: dcass-gen-traffic
    environment:
      <<: *common-env
    volumes:
      - ./storage/data:/app/storage/data:rw
    command: >
      python -u scripts/stealth/generate_traffic_dataset.py
        --num-sessions ${TRAFFIC_SESSIONS:-2000}
        --num-channels ${NUM_CHANNELS:-3}
        --output /app/storage/data/behavioral/human_traffic.json
    profiles:
      - training
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  dcass-train-gan:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: dcass:training
    container_name: dcass-train-gan
    environment:
      <<: *common-env
    volumes:
      - ./storage/data:/app/storage/data:ro
      - ./storage/models:/app/storage/models:rw
      - ./storage/logs/train-gan:/app/logs:rw
    command: >
      python -u scripts/stealth/train_gan.py
        --data /app/storage/data/behavioral/human_traffic.json
        --epochs ${GAN_EPOCHS:-50}
        --batch-size ${GAN_BATCH_SIZE:-32}
        --checkpoint-dir /app/storage/models/gan
        --out /app/storage/models/gan_generator.pt
        --device cpu
    profiles:
      - training
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G

  dcass-train-rl:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: dcass:training
    container_name: dcass-train-rl
    environment:
      <<: *common-env
    volumes:
      - ./storage/data:/app/storage/data:ro
      - ./storage/models:/app/storage/models:rw
      - ./storage/logs/train-rl:/app/logs:rw
    command: >
      python -u scripts/stealth/train_rl.py
        --episodes ${RL_EPISODES:-1000}
        --num-channels ${NUM_CHANNELS:-3}
        --warden-checkpoint /app/storage/models/gan_generator.pt
        --out /app/storage/models/rl_agent.pt
        --device cpu
    profiles:
      - training
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G

  # ─────────────────────────────────────────────────────────────────────────
  # Monitoring (profile: monitoring)
  # ─────────────────────────────────────────────────────────────────────────
  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: dcass-tensorboard
    hostname: tensorboard
    ports:
      - "${TENSORBOARD_PORT:-6006}:6006"
    volumes:
      - ./storage/logs:/logs:ro
    networks:
      - dcass-network
    command: tensorboard --logdir /logs --host 0.0.0.0 --port 6006 --bind_all
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Web Services (profile: web)
  # ─────────────────────────────────────────────────────────────────────────
  dcass-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: dcass:api
    container_name: dcass-api
    hostname: api
    environment:
      <<: *common-env
      DCASS_ROLE: api
      DCASS_DB_PATH: /app/storage/db/auth.db
      DCASS_ENV: ${DCASS_ENV:-development}
      DCASS_JWT_SECRET: ${DCASS_JWT_SECRET:-}
      DCASS_API_TOKEN: ${DCASS_API_TOKEN:-}
      DCASS_CORS_ORIGINS: ${DCASS_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      DCASS_CONTEXT_SECRET: ${DCASS_CONTEXT_SECRET:-}
      DCASS_DEVICE: ${DCASS_DEVICE:-cpu}
      DCASS_MAX_CONCURRENT_TRANSMISSIONS: ${DCASS_MAX_CONCURRENT_TRANSMISSIONS:-4}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - dcass-db:/app/storage/db:rw
      - ./storage/shared_channel:/app/storage/shared_channel:rw
      - ./storage/data:/app/storage/data:ro
      - ./storage/models:/app/storage/models:ro
    networks:
      - dcass-network
    command: >
      python -m uvicorn src.api.server:app
        --host 0.0.0.0
        --port 8000
        --workers 1
    profiles:
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'
        reservations:
          memory: 2G
    restart: unless-stopped

  dcass-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        API_INTERNAL_URL: http://dcass-api:8000
    image: dcass:frontend
    container_name: dcass-frontend
    hostname: frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - API_INTERNAL_URL=http://dcass-api:8000
    networks:
      - dcass-network
    depends_on:
      dcass-api:
        condition: service_healthy
    profiles:
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Automatic HTTPS Reverse Proxy (profile: proxy, pair with --profile web)
  # ─────────────────────────────────────────────────────────────────────────
  dcass-caddy:
    image: caddy:2-alpine
    container_name: dcass-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dcass-network
    depends_on:
      dcass-api:
        condition: service_healthy
      dcass-frontend:
        condition: service_healthy
    profiles:
      - proxy
    restart: unless-stopped

# ============================================================================
# Networks
# ============================================================================
networks:
  dcass-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================================
# Volumes (named volumes for persistence)
# ============================================================================
volumes:
  dcass-db:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  shared_channel:
    driver: local
  models:
    driver: local
  logs:
    driver: local
