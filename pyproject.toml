[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dcass"
version = "0.3.0"
description = "Dynamic Context-Aware Semantic Steganography via Zero-Modification Media Curation"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["embeddings_legacy*", "*.pyc"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: mark test as integration test (requires indices)",
    "slow: mark test as slow running",
    "needs_models: mark test as requiring trained model checkpoints under storage/models",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage (drives .venv coverage run -m pytest; pytest-cov is not installed)
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "storage",
    "phase3_out",
    "frontend",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # long lines allowed in docstring-heavy research code
]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts manipulate sys.path before project imports.
"scripts/**/*.py" = ["E402"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "(\\.venv|storage|phase3_out|frontend)"
