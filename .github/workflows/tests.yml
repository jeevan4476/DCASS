name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install matching CPU-only torch and torchvision first to avoid binary mismatches
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install git+https://github.com/openai/CLIP.git@main

      - name: Lint
        run: |
          ruff check src/ tests/

      - name: Run tests (no integration artifacts required)
        run: |
          pytest tests/ --no-integration

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile || bun install

      - name: TypeScript check
        working-directory: frontend
        run: bunx tsc --noEmit
